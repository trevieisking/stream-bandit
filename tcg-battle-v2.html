<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stream Bandit TCG — Battle V2</title>
<link rel="icon" type="image/png" sizes="32x32" href="stream_bandit_stag_icon_32.png">
<link rel="apple-touch-icon" href="apple_touch_icon_180.png">
<meta name="theme-color" content="#050711">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#050711;--panel:#0e1327;--line:#ffffff22;--text:#f7f8ff;--muted:#aeb8d4;--good:#22d3a6;--cyan:#41e8ff;--pink:#ff2d85;--purple:#7c3cff;--warn:#ffb142;--bad:#ff4d6d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:0;overflow:hidden;background-color:var(--bg);background-image:linear-gradient(180deg,#0206118a,#020611e8),url("assets/tcg-realm-client-backdrop-v2-4-30.svg");background-size:cover;background-position:center;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
button{font:inherit}
.sb-battle{width:100%;height:100dvh;min-height:0;margin:0;padding:8px}
.sb-board{height:100%;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 1px minmax(0,1fr) minmax(94px,.58fr);gap:8px}
.sb-side{min-height:0;overflow:auto;border:1px solid #55d9ff44;border-radius:22px;background:linear-gradient(135deg,#071322e8,#10152be8);padding:10px;box-shadow:inset 0 0 30px #41e8ff0a,0 12px 34px #0008;backdrop-filter:blur(5px)}
.sb-side-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.sb-side-title{font-size:15px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.sb-player-cosmetic{display:flex;align-items:center;gap:9px;min-width:0}
.sb-player-avatar{width:44px;height:44px;min-width:44px;border:1px solid #41e8ff66;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 35% 25%,#41e8ff38,#7c3cff29 58%,#07101f);color:#dffbff;font-weight:950;box-shadow:0 0 18px #41e8ff24}
.sb-player-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.sb-player-copy{min-width:0}
.sb-player-copy strong{display:block;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.sb-player-copy small{display:block;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8f9abb;font-size:10px;margin-top:2px}
.sb-match-meta{display:grid;gap:5px;justify-items:end;min-width:min(420px,50%)}
.sb-pills{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.sb-pill{border:1px solid #ffffff26;border-radius:999px;padding:4px 8px;color:var(--muted);background:#050b18b8;font-size:10px;font-weight:850}
.sb-status{max-width:520px;padding:5px 8px;border:1px solid #41e8ff44;border-radius:12px;background:#04101dd9;color:#dffbff;font-size:10px;font-weight:800;text-align:right}
.sb-status[data-kind="error"]{border-color:#ff4d6d66;background:#2a0710d9;color:#ffd7df}
.sb-status[data-kind="ready"]{border-color:#22d3a666;background:#052018d9;color:#d7fff1}
.sb-status[data-kind="busy"]{border-color:#ffb14266;background:#281b06d9;color:#ffedbd}
.sb-field{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:9px;align-items:start}
.sb-vanguard-slot,.sb-reserve-slot{border:1px dashed #ffffff24;border-radius:18px;padding:7px;min-height:132px;background:#06101db8}
.sb-vanguard-slot{border-style:solid;border-color:#22d3a654;background:#06201970}
.sb-reserve{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:7px}
.sb-reserve-slot>span,.sb-vanguard-slot>span{display:block;color:#8691b2;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.sb-card-control,.sb-hand-card{border:1px solid #ffffff2b;border-radius:18px;background:linear-gradient(150deg,#171d36,#0f1327);padding:9px;box-shadow:0 8px 24px #0005;transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;overflow:hidden}
.sb-card-control header{display:flex;justify-content:space-between;gap:8px;color:#b9c6e6;font-size:10px;font-weight:900;text-transform:uppercase}
.sb-card-control h2{font-size:16px;margin:7px 0;line-height:1.05}
.sb-card-art{height:88px;border-radius:12px;background:linear-gradient(135deg,#22d3a620,#7c3cff2d,#ff2d851e);display:grid;place-items:center;font-size:30px;border:1px solid #ffffff16;overflow:hidden}.sb-card-art img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:11px;display:block}
.sb-hp,.sb-card-meta{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:6px;font-size:11px}
.sb-hp strong{color:#baf7df}
.sb-card-meta{color:var(--muted)}
.sb-card-control.is-primary{cursor:pointer}
.sb-card-control.is-primary:hover,.sb-card-control.is-primary:focus-visible{transform:translateY(-2px);border-color:#41e8ff88;outline:none}
.sb-card-control.is-selected{border-color:var(--good);box-shadow:0 0 0 2px #22d3a63d,0 12px 32px #0007}
.sb-card-hint{margin-top:7px;border-top:1px solid #ffffff18;padding-top:6px;color:#b9c6e6;font-size:10px;font-weight:850}
.sb-card-actions{display:none;gap:6px;margin-top:7px}
.sb-card-control.is-selected .sb-card-actions{display:grid}
.sb-card-action{width:100%;border:1px solid #ffffff24;border-radius:12px;padding:7px 8px;background:linear-gradient(135deg,#ff2d8527,#7c3cff35);color:white;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}
.sb-card-action:disabled{opacity:.45;cursor:not-allowed}
.sb-card-action strong,.sb-card-action small{display:block}
.sb-card-action small{color:#c5cbe1;font-size:9px;margin-top:2px}
.sb-damage{font-size:18px;font-weight:950;color:#fff}
.sb-zone-empty{display:grid;place-items:center;min-height:88px;color:#697494;font-size:12px}
.sb-hand-wrap{min-height:0;overflow:hidden;border:1px solid #55d9ff44;border-radius:20px;padding:8px;background:#06101de8;box-shadow:inset 0 0 26px #41e8ff08,0 10px 28px #0007}
.sb-hand-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8f9abb;font-weight:900;margin:0 0 6px}
.sb-hand{height:calc(100% - 20px);display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding-bottom:3px}
.sb-hand-card{flex:0 0 132px;min-height:82px;display:flex;flex-direction:column;justify-content:space-between}
.sb-hand-card strong{font-size:12px}
.sb-hand-card small{color:var(--muted)}
.sb-separator{height:1px;background:linear-gradient(90deg,transparent,#55d9ff44,transparent)}
@media(max-width:980px){.sb-field{grid-template-columns:1fr}.sb-reserve{grid-template-columns:repeat(4,minmax(105px,1fr));overflow-x:auto}.sb-reserve-slot{min-width:105px}.sb-vanguard-slot{max-width:340px;width:100%}.sb-match-meta{min-width:0;max-width:48%}}
@media(max-width:640px){html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.sb-battle{height:auto;min-height:100dvh;padding:5px}.sb-board{height:auto;min-height:100dvh;gap:5px;grid-template-rows:auto 1px auto auto}.sb-side{min-height:0;overflow:visible;padding:7px;border-radius:16px}.sb-side-header{gap:6px}.sb-player-avatar{width:36px;height:36px;min-width:36px}.sb-player-copy strong{font-size:12px}.sb-player-copy small{font-size:8px}.sb-match-meta{max-width:52%}.sb-status{font-size:8px;padding:4px 6px}.sb-pill{font-size:8px;padding:3px 6px}.sb-reserve{grid-template-columns:repeat(4,108px)}.sb-card-control h2{font-size:13px}.sb-card-art{height:110px}.sb-card-art img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:10px;display:block}.sb-vanguard-slot,.sb-reserve-slot{min-height:112px}.sb-hand-wrap{min-height:132px;overflow:visible}.sb-hand{height:auto;min-height:104px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}.sb-hand-card{scroll-snap-align:start}}
</style>
</head>
<body data-sb-tcg-page="battle" data-sb-tcg-v2-battle="board-only-v0-4">
<main class="sb-battle">
  <section class="sb-board" aria-label="One-screen battlefield">
    <section class="sb-side" aria-label="Opponent field">
      <header class="sb-side-header">
        <div class="sb-player-cosmetic" aria-label="Matched opponent">
          <div class="sb-player-avatar" id="oppAvatarFallback" aria-hidden="true">VS</div>
          <div class="sb-player-avatar" id="oppAvatarFrame" hidden><img id="oppAvatar" alt=""></div>
          <div class="sb-player-copy">
            <strong id="oppName">Opponent</strong>
            <small id="oppHandle">Matched player</small>
          </div>
        </div>
        <div class="sb-match-meta" aria-label="Battle state">
          <div class="sb-pills"><span class="sb-pill" id="turnPill">Loading…</span><span class="sb-pill" id="phasePill">—</span><span class="sb-pill" id="revisionPill">Revision —</span></div>
          <div class="sb-status" id="battleStatus" aria-live="polite">Loading authoritative battle state…</div>
        </div>
      </header>
      <div class="sb-field">
        <section class="sb-vanguard-slot"><span>Vanguard</span><div id="oppVanguard"></div></section>
        <div class="sb-reserve" id="oppReserve"></div>
      </div>
    </section>

    <div class="sb-separator"></div>

    <section class="sb-side" aria-label="Your field">
      <header class="sb-side-header"><h1 class="sb-side-title">Your field</h1></header>
      <div class="sb-field">
        <section class="sb-vanguard-slot"><span>Vanguard · Primary card control</span><div id="youVanguard"></div></section>
        <div class="sb-reserve" id="youReserve"></div>
      </div>
    </section>

    <section class="sb-hand-wrap" aria-label="Your hand">
      <h1 class="sb-hand-title">Your hand · card controls</h1>
      <div class="sb-hand" id="yourHand"></div>
    </section>
  </section>
</main>

<script src="stream-bandit-tcg-config-v2-4-31.js?v=2-4-31"></script>
<script src="stream-bandit-auth-gate-v7-13-001.js?v=tcg-v2-battle-v0-4"></script>
<script src="stream-bandit-tcg-art-resolver-v2-4-36.js?v=2-4-46"></script>
<script src="stream-bandit-tcg-v2-battle-controller.js?v=0-4"></script>
</body>
</html>
