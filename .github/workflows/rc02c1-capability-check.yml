name: RC-02c1 Capability Check

on:
  push:
    branches:
      - repair/tcg-rc02c1-incoming-capability-29d92a7

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out isolated candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard accepted parent and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED=29d92a7bb9df9385630ae9d8df67ef069a6e1eaa
          test "$(git merge-base HEAD "$ACCEPTED")" = "$ACCEPTED"
          git diff --name-only "$ACCEPTED"...HEAD | sort > /tmp/files.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/rc02c1-capability-check.yml
          tcg-runtime-capabilities-v0.2.json
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          comm -23 /tmp/files.txt /tmp/allowed.txt > /tmp/unexpected.txt
          test ! -s /tmp/unexpected.txt || { cat /tmp/unexpected.txt; exit 1; }

      - name: Materialize exact capability correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tcg-runtime-capabilities-v0.2.json')
          source = path.read_text()
          op = 'ADD_INCOMING_ATTACK_DAMAGE_MODIFIER'
          implemented_anchor = '      "ADD_ATTACK_DAMAGE_MODIFIER",\n'
          implemented_line = f'      "{op}",\n'
          missing_anchor = '    "missing": [\n      "ADD_INCOMING_ATTACK_DAMAGE_MODIFIER",\n'
          already_implemented = implemented_anchor + implemented_line in source
          still_missing = missing_anchor in source
          if already_implemented and not still_missing:
              pass
          else:
              if source.count(implemented_anchor) != 1:
                  raise SystemExit('incoming_modifier_implemented_anchor_changed')
              if source.count(missing_anchor) != 1:
                  raise SystemExit('incoming_modifier_missing_anchor_changed')
              source = source.replace(implemented_anchor, implemented_anchor + implemented_line, 1)
              source = source.replace(missing_anchor, '    "missing": [\n', 1)
          path.write_text(source)
          PY

      - name: Prove one classification and valid JSON
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('tcg-runtime-capabilities-v0.2.json','utf8'));
          const op = 'ADD_INCOMING_ATTACK_DAMAGE_MODIFIER';
          if ((c.operations.implemented || []).filter(x => x === op).length !== 1) throw new Error('incoming modifier must be implemented exactly once');
          if ((c.operations.partial || []).includes(op)) throw new Error('incoming modifier remained partial');
          if ((c.operations.missing || []).includes(op)) throw new Error('incoming modifier remained missing');
          NODE

      - name: Run capability and selected-modifier contracts
        run: |
          node --test tcg/tests/card-pass-2-runtime-capabilities.test.mjs
          node --test tcg/tests/card-pass-2-runtime-active-ability-selected-modifier-wiring.test.mjs

      - name: Commit tested capability correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "tcg-runtime-capabilities-v0.2.json"
          git config user.name "Stream Bandit RC-02c1 verifier"
          git config user.email "actions@users.noreply.github.com"
          git add tcg-runtime-capabilities-v0.2.json
          git commit -m "chore(tcg): classify incoming attack modifier implemented"
          git push origin HEAD:repair/tcg-rc02c1-incoming-capability-29d92a7
