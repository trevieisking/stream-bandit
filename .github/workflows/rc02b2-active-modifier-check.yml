name: RC-02b2 Active Modifier Check

on:
  push:
    branches:
      - repair/tcg-rc02b2-active-modifier-974a6ed

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard accepted parent and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED=974a6edb66e8821ae7e3543ebd31bfa492c9449a
          test "$(git merge-base HEAD "$ACCEPTED")" = "$ACCEPTED"
          git diff --name-only "$ACCEPTED"...HEAD | sort > /tmp/files.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/rc02b2-active-modifier-check.yml
          supabase/functions/_shared/tcg-match-active-ability-live-v0-2.ts
          supabase/functions/_shared/tcg-match-active-ability-selected-modifier-v0-2.ts
          supabase/functions/tcg-match-actions/index.ts
          supabase/functions/tcg-tactic-actions/runtime-v0-2-active-ability-selected-modifier.test.ts
          tcg/tests/card-pass-2-runtime-active-ability-selected-modifier-wiring.test.mjs
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          comm -23 /tmp/files.txt /tmp/allowed.txt > /tmp/unexpected.txt
          test ! -s /tmp/unexpected.txt || { cat /tmp/unexpected.txt; exit 1; }

      - name: Materialize exact Match Actions orchestration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/tcg-match-actions/index.ts')
          source = path.read_text()

          old_forbidden = 'const forbidden=["tcg_v0_2_active_ability_choice_not_yours","tcg_v0_2_active_ability_heal_choice_not_yours"];'
          new_forbidden = 'const forbidden=["tcg_v0_2_active_ability_choice_not_yours","tcg_v0_2_active_ability_heal_choice_not_yours","tcg_v0_2_active_ability_modifier_choice_not_yours"];'
          if new_forbidden not in source:
              if source.count(old_forbidden) != 1:
                  raise SystemExit('active_ability_forbidden_anchor_changed')
              source = source.replace(old_forbidden, new_forbidden, 1)

          old_stale_tail = '"tcg_v0_2_active_ability_heal_limit_receipt_missing"];const status='
          new_stale_tail = '"tcg_v0_2_active_ability_heal_limit_receipt_missing","tcg_v0_2_active_ability_modifier_choice_stale_id","tcg_v0_2_active_ability_modifier_turn_changed","tcg_v0_2_active_ability_modifier_active_seat_changed","tcg_v0_2_active_ability_modifier_source_changed","tcg_v0_2_active_ability_modifier_target_set_changed","tcg_v0_2_active_ability_modifier_target_changed","tcg_v0_2_active_ability_modifier_limit_receipt_missing"];const status='
          if new_stale_tail not in source:
              if source.count(old_stale_tail) != 1:
                  raise SystemExit('active_ability_stale_anchor_changed')
              source = source.replace(old_stale_tail, new_stale_tail, 1)

          reward_anchor = 's.phase="play";return json({version:VERSION,result:await commit("resolve_ability_choice",{seat,ability_id:resolved.ability_id,kind:resolved.kind,reward_inspected_count:resolved.reward_inspected_count})})'
          modifier_branch = 'if(resolved.kind==="modify_one_friendly_creature"){log(`Seat ${seat} used Ability ${resolved.ability_id} to apply a ${resolved.modifier_kind} modifier.`);s.phase="play";return json({version:VERSION,result:await commit("resolve_ability_choice",{seat,ability_id:resolved.ability_id,kind:resolved.kind,modifier_kind:resolved.modifier_kind,target_creature_uid:resolved.target_creature_uid})})}'
          resolve_start = source.find('if(action==="resolve_ability_choice")')
          if resolve_start < 0:
              raise SystemExit('active_ability_resolve_block_missing')
          reward_index = source.find(reward_anchor, resolve_start)
          if modifier_branch not in source[resolve_start:]:
              if reward_index < 0:
                  raise SystemExit('active_ability_reward_anchor_changed')
              source = source[:reward_index] + modifier_branch + source[reward_index:]

          path.write_text(source)
          PY

      - name: Run selected-modifier source contract
        run: node --test tcg/tests/card-pass-2-runtime-active-ability-selected-modifier-wiring.test.mjs

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Active-Ability runtime family
        run: deno test supabase/functions/tcg-tactic-actions/runtime-v0-2-active-ability-*.test.ts

      - name: Run delegated owner regressions
        run: |
          deno test \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-modifier-engine.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-damage-protection.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-damage-prevention-authority.test.ts

      - name: Type-check selected modifier owner and facade
        run: |
          deno check supabase/functions/_shared/tcg-match-active-ability-selected-modifier-v0-2.ts
          deno check supabase/functions/_shared/tcg-match-active-ability-live-v0-2.ts

      - name: Type-check Match Actions
        run: deno check supabase/functions/tcg-match-actions/index.ts

      - name: Commit tested dispatcher patch if newly materialized
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/tcg-match-actions/index.ts; then
            echo "Dispatcher patch already materialized."
            exit 0
          fi
          test "$(git diff --name-only)" = "supabase/functions/tcg-match-actions/index.ts"
          git config user.name "Stream Bandit RC-02b2 verifier"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/tcg-match-actions/index.ts
          git commit -m "feat(tcg): wire selected modifier ability result"
          git push origin HEAD:repair/tcg-rc02b2-active-modifier-974a6ed
