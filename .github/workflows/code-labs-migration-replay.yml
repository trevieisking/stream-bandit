name: Code Labs Migration Replay

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/code-labs-migration-replay.yml
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/functions/code-labs-mcp-stub/migration-replay-baseline.contract.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-labs-migration-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Replay every migration from zero
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run source replay contract
        run: node --test supabase/functions/code-labs-mcp-stub/migration-replay-baseline.contract.test.mjs

      - name: Audit unique migration versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join(process.cwd(), 'supabase', 'migrations');
          const groups = new Map();
          for (const name of fs.readdirSync(dir).filter((value) => value.endsWith('.sql')).sort()) {
            const match = name.match(/^(\d+)_/);
            if (!match) continue;
            const list = groups.get(match[1]) || [];
            list.push(name);
            groups.set(match[1], list);
          }
          const duplicates = [...groups.entries()].filter(([, names]) => names.length > 1);
          if (duplicates.length === 0) {
            console.log('All migration versions are unique.');
            process.exit(0);
          }
          console.error('Duplicate migration versions found:');
          for (const [version, names] of duplicates) {
            console.error(`${version}:`);
            for (const name of names) console.error(`  - ${name}`);
          }
          process.exit(1);
          NODE

      - name: Start disposable local database
        run: supabase db start

      - name: Reset and replay every migration again
        run: supabase db reset --local --no-seed

      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup || true
