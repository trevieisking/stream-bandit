name: TCG Pass C Attack Shield Temporary

on:
  push:
    branches:
      - feature/tcg-private-alpha-v0-5-source-recovery
    paths:
      - .github/workflows/tcg-pass-c-attack-shield-temp.yml

permissions:
  contents: write

jobs:
  pass-c-attack-shield:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/tcg-private-alpha-v0-5-source-recovery
          fetch-depth: 0

      - name: Guard exact staging chain
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "ab9b5d591fe5f46a22c120c6bbd8cac27d207215"
          test "$(git rev-parse HEAD^^)" = "b2b9460d02c59b80a57b6d11e9430a1be706fa41"
          test "$(git rev-parse HEAD^^^)" = "55c88eec7ea7289ad09dc206aab311df3b70e799"
          actual="$(git diff --name-only HEAD^^^..HEAD | sort)"
          expected="$(printf '%s\n' '.github/scripts/tcg-pass-c-attack-shield.py' '.github/workflows/tcg-pass-c-attack-shield-temp.yml' | sort)"
          test "$actual" = "$expected"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded Pass C Shield slice
        shell: bash
        run: |
          python .github/scripts/tcg-pass-c-attack-shield.py
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Run full TCG proof before commit
        shell: bash
        run: |
          git diff --check
          deno test supabase/functions/tcg-tactic-actions/runtime-v0-2-*.test.ts
          deno check supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts
          deno check supabase/functions/tcg-tactic-actions/index.ts
          deno check supabase/functions/tcg-match-actions/index.ts
          node --test tcg/tests/card-pass-2-*.test.mjs

      - name: Freeze exact permanent file set and commit
        shell: bash
        run: |
          git rm .github/scripts/tcg-pass-c-attack-shield.py .github/workflows/tcg-pass-c-attack-shield-temp.yml
          actual="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/tcg-pass-c-attack-shield.py' \
            '.github/workflows/tcg-pass-c-attack-shield-temp.yml' \
            'supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts' \
            'supabase/functions/tcg-match-actions/index.ts' \
            'supabase/functions/tcg-tactic-actions/index.ts' \
            'supabase/functions/tcg-tactic-actions/runtime-v0-2-core.ts' \
            'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-shield-effects.test.ts' \
            'tcg/tests/card-pass-2-runtime-attack-shield-wiring.test.mjs' | sort)"
          test "$actual" = "$expected"
          git diff --check
          git add -A
          git config user.name "Trevor"
          git config user.email "269324007+trevieisking@users.noreply.github.com"
          git commit -m "TCG: structure attack Shield gain"
          git push origin HEAD:feature/tcg-private-alpha-v0-5-source-recovery
