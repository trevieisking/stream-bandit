name: TCG RC-02b2a Repair

on:
  push:
    branches:
      - repair/tcg-rc-02b2a-da87b4c

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard immutable base and transport-only commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=da87b4c6e212317e38492f23c707c5862df13ffa
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE"..HEAD)" = ".github/workflows/tcg-rc-02b2a-repair.yml"

      - name: Patch canonical Attack modifier ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, got {count}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, got {count}")
              return next_text

          surge_path = Path("supabase/functions/_shared/tcg-match-surge-lifecycle-v0-2.ts")
          surge = surge_path.read_text()
          surge = replace_once(
              surge,
              'import { runtimeV02Definition } from "./tcg-runtime-registry-v0-2.ts";\n',
              'import { runtimeV02InstallAttackDamageModifier } from "./tcg-match-attack-modifier-v0-2.ts";\nimport { runtimeV02Definition } from "./tcg-runtime-registry-v0-2.ts";\n',
              "surge canonical owner import",
          )
          surge = replace_once(
              surge,
              'export type RuntimeLifecycleCreature = {\n  essence?: RuntimeLifecycleInstance[];\n  flags?: Record<string, unknown>;\n};',
              'export type RuntimeLifecycleCreature = {\n  stack?: RuntimeLifecycleInstance[];\n  essence?: RuntimeLifecycleInstance[];\n  flags?: Record<string, unknown>;\n};',
              "surge target stack identity",
          )
          surge = regex_once(
              surge,
              r'\ntype AttackModifier = \{.*?\n\};\n',
              '\n',
              "remove duplicate legacy modifier type",
          )
          surge = regex_once(
              surge,
              r'\nfunction attackModifiers\(.*?\n\}\n\nexport function applyRuntimeV02AttachmentAttackDamageModifier',
              '\nexport function applyRuntimeV02AttachmentAttackDamageModifier',
              "remove duplicate modifier writer",
          )
          surge = regex_once(
              surge,
              r'export function applyRuntimeV02AttachmentAttackDamageModifier\(.*?\n\}\n\n/\*\*\n \* Registers only the attachment lifecycle state',
              '''export function applyRuntimeV02AttachmentAttackDamageModifier(\n  state: Record<string, unknown>,\n  creature: RuntimeLifecycleCreature,\n  sourceUidRaw: unknown,\n  sourceActionIdRaw: unknown,\n  targetUidRaw: unknown,\n  amountRaw: unknown,\n  turnSeqRaw: unknown,\n  durationRaw: unknown,\n): number | null {\n  const installed = runtimeV02InstallAttackDamageModifier(state, creature, {\n    source_uid: sourceUidRaw,\n    source_action_id: sourceActionIdRaw,\n    target_uid: targetUidRaw,\n    amount: amountRaw,\n    turn_seq: turnSeqRaw,\n    duration: durationRaw,\n  });\n  return installed?.amount ?? null;\n}\n\n/**\n * Registers only the attachment lifecycle state''',
              "delegate attachment modifier to Attack #14",
          )
          surge = replace_once(
              surge,
              '  let attackBonus = 0;\n  const listeners = Array.isArray(essence.listeners) ? essence.listeners : [];',
              '  const targetUid = creature.stack?.length\n    ? String(creature.stack[creature.stack.length - 1]?.uid || "").trim()\n    : "";\n  if (!targetUid) throw new Error("tcg_v0_2_attachment_listener_target_uid_required");\n\n  let attackBonus = 0;\n  const listeners = Array.isArray(essence.listeners) ? essence.listeners : [];',
              "derive exact modifier target identity",
          )
          surge = replace_once(
              surge,
              '        attached.uid,\n        step.amount,\n        turnSeq,\n        step.duration,',
              '        attached.uid,\n        String(listener.id || ""),\n        targetUid,\n        step.amount,\n        turnSeq,\n        step.duration,',
              "pass exact listener action identity",
          )
          surge = regex_once(
              surge,
              r'export function structuredRuntimeAttachmentAttackBonus\(.*?\n\}\n\nexport function clearStructuredRuntimeAttachmentAttackBonusesAtAftermath',
              '''export function structuredRuntimeAttachmentAttackBonus(\n  state: Record<string, unknown>,\n  creature: RuntimeLifecycleCreature,\n  turnSeq: number,\n): number | null {\n  if (!structuredProbe(state)) return null;\n  const raw = creature.flags?.runtime_v0_2_attack_modifiers;\n  if (raw == null) return 0;\n  if (!Array.isArray(raw)) throw new Error("tcg_v0_2_attack_modifiers_invalid");\n  let total = 0;\n  for (const rawItem of raw) {\n    const item = objectRecord(rawItem);\n    if (!item) throw new Error("tcg_v0_2_attack_modifier_record_invalid");\n    // Canonical Attack #14 records are consumed at legal declaration. This\n    // compatibility reader is legacy-only and must never apply them twice.\n    if (item.schema === "sb-tcg-attack-damage-modifier-v0.2") continue;\n    if (Number(item.turn_seq) !== turnSeq) continue;\n    if (!Array.isArray(item.expires_on) || !item.expires_on.includes("end_of_turn")) continue;\n    const amount = Number(item.amount);\n    if (!Number.isFinite(amount)) throw new Error("tcg_v0_2_attack_modifier_amount_invalid");\n    total += amount;\n  }\n  return total;\n}\n\nexport function clearStructuredRuntimeAttachmentAttackBonusesAtAftermath''',
              "make legacy bonus reader ignore canonical records",
          )
          surge = regex_once(
              surge,
              r'export function clearStructuredRuntimeAttachmentAttackBonusesAtAftermath\(.*?\n\}\n\nexport function structuredRuntimeAftermathEssenceDisposition',
              '''export function clearStructuredRuntimeAttachmentAttackBonusesAtAftermath(\n  state: Record<string, unknown>,\n  creature: RuntimeLifecycleCreature,\n  turnSeq: number,\n): boolean | null {\n  if (!structuredProbe(state)) return null;\n  const raw = creature.flags?.runtime_v0_2_attack_modifiers;\n  if (raw == null) return false;\n  if (!Array.isArray(raw)) throw new Error("tcg_v0_2_attack_modifiers_invalid");\n  let removed = false;\n  const kept = raw.filter((rawItem) => {\n    const item = objectRecord(rawItem);\n    if (!item) throw new Error("tcg_v0_2_attack_modifier_record_invalid");\n    // Canonical records expire in Attack #14, not in this compatibility facade.\n    if (item.schema === "sb-tcg-attack-damage-modifier-v0.2") return true;\n    const shouldRemove = Number(item.turn_seq) === turnSeq &&\n      Array.isArray(item.expires_on) && item.expires_on.includes("end_of_turn");\n    if (shouldRemove) removed = true;\n    return !shouldRemove;\n  });\n  (creature.flags as Record<string, unknown>).runtime_v0_2_attack_modifiers = kept;\n  return removed;\n}\n\nexport function structuredRuntimeAftermathEssenceDisposition''',
              "make legacy cleanup leave canonical expiry to Attack #14",
          )
          surge_path.write_text(surge)

          event_path = Path("supabase/functions/_shared/tcg-match-event-listener-v0-2.ts")
          event = event_path.read_text()
          event = replace_once(
              event,
              '      candidate.source.uid,\n      step.amount,\n      currentTurn(state),\n      step.duration,',
              '      candidate.source.uid,\n      listenerId(candidate),\n      target.top.uid,\n      step.amount,\n      currentTurn(state),\n      step.duration,',
              "event listener exact modifier identity",
          )
          event_path.write_text(event)

          listener_test_path = Path("supabase/functions/tcg-tactic-actions/runtime-v0-2-event-listener-attachment-attack-modifier.test.ts")
          listener_test = listener_test_path.read_text()
          listener_test = replace_once(
              listener_test,
              'import { structuredRuntimeAttachmentAttackBonus } from "../_shared/tcg-match-surge-lifecycle-v0-2.ts";\n',
              'import { runtimeV02ConsumeAttackDamageModifiersOnLegalDeclaration } from "../_shared/tcg-match-attack-modifier-v0-2.ts";\nimport { structuredRuntimeAttachmentAttackBonus } from "../_shared/tcg-match-surge-lifecycle-v0-2.ts";\n',
              "listener test canonical consumer import",
          )
          listener_test = replace_once(
              listener_test,
              '  equal(modifiers[0].max_uses, 1, "Smolder must remain one-use");\n  equal(\n    structuredRuntimeAttachmentAttackBonus(state, (state.players as any)["1"].vanguard, 7),\n    10,\n    "attack owner must expose the stored +10 bonus",\n  );',
              '  equal(modifiers[0].max_uses, 1, "Smolder must remain one-use");\n  equal(modifiers[0].schema, "sb-tcg-attack-damage-modifier-v0.2", "Smolder must use canonical Attack #14 record schema");\n  equal(modifiers[0].source_action_id, "smolder-attach-pressure", "Smolder must preserve exact listener action identity");\n  equal(modifiers[0].target_uid, "source-creature-uid", "Smolder must bind the exact target Creature");\n  equal(\n    structuredRuntimeAttachmentAttackBonus(state, (state.players as any)["1"].vanguard, 7),\n    0,\n    "legacy Surge reader must ignore canonical Attack #14 records",\n  );\n  const consumed = runtimeV02ConsumeAttackDamageModifiersOnLegalDeclaration(\n    state,\n    (state.players as any)["1"].vanguard,\n    { consuming_action_id: "smolder-attack", target_uid: "source-creature-uid", turn_seq: 7, base_damage: 40 },\n  );\n  equal(consumed?.bonus_damage, 10, "canonical consumer must apply Smolder exactly once");\n  equal(consumed?.damage, 50, "Smolder canonical damage total mismatch");',
              "listener test Smolder canonical consumption",
          )
          listener_test = replace_once(
              listener_test,
              '  equal(modifiers[0].max_uses, null, "Surge must remain reusable for the turn");\n  equal(\n    structuredRuntimeAttachmentAttackBonus(state, (state.players as any)["1"].vanguard, 7),\n    20,\n    "attack owner must expose the stored +20 bonus",\n  );',
              '  equal(modifiers[0].max_uses, null, "Surge must remain reusable for the turn");\n  equal(modifiers[0].schema, "sb-tcg-attack-damage-modifier-v0.2", "Surge must use canonical Attack #14 record schema");\n  equal(modifiers[0].source_action_id, "surge-attach-burst", "Surge must preserve exact listener action identity");\n  equal(\n    structuredRuntimeAttachmentAttackBonus(state, (state.players as any)["1"].vanguard, 7),\n    0,\n    "legacy Surge reader must not double-count canonical reusable records",\n  );\n  const firstAttack = runtimeV02ConsumeAttackDamageModifiersOnLegalDeclaration(\n    state,\n    (state.players as any)["1"].vanguard,\n    { consuming_action_id: "surge-attack-1", target_uid: "source-creature-uid", turn_seq: 7, base_damage: 40 },\n  );\n  const secondAttack = runtimeV02ConsumeAttackDamageModifiersOnLegalDeclaration(\n    state,\n    (state.players as any)["1"].vanguard,\n    { consuming_action_id: "surge-attack-2", target_uid: "source-creature-uid", turn_seq: 7, base_damage: 40 },\n  );\n  equal(firstAttack?.bonus_damage, 20, "Surge first attack bonus mismatch");\n  equal(secondAttack?.bonus_damage, 20, "Surge reusable bonus must remain exactly once on later attacks");',
              "listener test Surge canonical consumption",
          )
          listener_test = replace_once(
              listener_test,
              '  equal(modifiers[0].source_uid, "source-creature-uid", "Power Rail modifier source must be the Creature instance");\n  equal(modifiers[0].amount, 20, "Power Rail amount must remain +20");',
              '  equal(modifiers[0].source_uid, "source-creature-uid", "Power Rail modifier source must be the Creature instance");\n  equal(modifiers[0].source_action_id, "power-rail", "Power Rail must preserve exact Ability action identity");\n  equal(modifiers[0].target_uid, "source-creature-uid", "Power Rail must bind its exact target Creature");\n  equal(modifiers[0].amount, 20, "Power Rail amount must remain +20");',
              "listener test Power Rail action identity",
          )
          listener_test_path.write_text(listener_test)

          surge_test_path = Path("supabase/functions/tcg-tactic-actions/runtime-v0-2-surge-lifecycle-bridge.test.ts")
          surge_test = surge_test_path.read_text()
          surge_test = replace_once(
              surge_test,
              'import {\n  applyStructuredRuntimeEssenceAttachmentLifecycle,',
              'import { runtimeV02ExpireAttackDamageModifiersAtEndOfTurn } from "../_shared/tcg-match-attack-modifier-v0-2.ts";\nimport {\n  applyStructuredRuntimeEssenceAttachmentLifecycle,',
              "surge test canonical expiry import",
          )
          surge_test = replace_once(
              surge_test,
              'function structuredState(extra: Record<string, any> = {}) {',
              'function targetCreature(uid = "target-creature-uid") {\n  return { stack: [{ uid, card_id: "test-target-creature" }], essence: [], flags: {} } as any;\n}\n\nfunction structuredState(extra: Record<string, any> = {}) {',
              "surge test target helper",
          )
          surge_test = surge_test.replace('const creature: any = { essence: [], flags: {} };', 'const creature: any = targetCreature();')
          surge_test = replace_once(
              surge_test,
              '  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 12) === 20, "structured attack should receive Surge +20");',
              '  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 12) === 0, "legacy reader must ignore canonical Surge records");\n  assert(modifier?.schema === "sb-tcg-attack-damage-modifier-v0.2", "Surge must install the canonical Attack #14 schema");\n  assert(modifier?.source_action_id === "surge-attach-burst", "Surge must preserve its listener action id");\n  assert(modifier?.target_uid === "target-creature-uid", "Surge must bind the exact target Creature uid");',
              "surge canonical record assertions",
          )
          old_cleanup = '''  applyStructuredRuntimeEssenceAttachmentLifecycle(state, creature, surge, "Volt", "hand", 9);\n  creature.flags.runtime_v0_2_attack_modifiers.push({ source_uid: "future", amount: 30, turn_seq: 10, expires_on: ["end_of_turn"], max_uses: null });\n  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 9) === 20, "current turn Surge bonus mismatch");\n  assert(clearStructuredRuntimeAttachmentAttackBonusesAtAftermath(state, creature, 9) === true, "current-turn modifier should be cleared");\n  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 9) === 0, "expired Surge bonus must not remain");\n  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 10) === 30, "future-turn modifier must not be removed by earlier cleanup");'''
          new_cleanup = '''  applyStructuredRuntimeEssenceAttachmentLifecycle(state, creature, surge, "Volt", "hand", 9);\n  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 9) === 0, "legacy reader must ignore current canonical Surge bonus");\n  assert(clearStructuredRuntimeAttachmentAttackBonusesAtAftermath(state, creature, 9) === false, "compatibility cleanup must leave canonical records to Attack #14");\n  const expiry = runtimeV02ExpireAttackDamageModifiersAtEndOfTurn(state, creature, 9);\n  assert(expiry?.removed_count === 1, "Attack #14 must expire the canonical Surge record");\n  creature.flags.runtime_v0_2_attack_modifiers.push({ source_uid: "future", amount: 30, turn_seq: 10, expires_on: ["end_of_turn"], max_uses: null });\n  assert(structuredRuntimeAttachmentAttackBonus(state, creature, 10) === 30, "legacy future-turn compatibility record must remain readable");\n  assert(clearStructuredRuntimeAttachmentAttackBonusesAtAftermath(state, creature, 9) === false, "earlier compatibility cleanup must not remove a future legacy record");'''
          surge_test = replace_once(surge_test, old_cleanup, new_cleanup, "surge expiry owner test")
          surge_test_path.write_text(surge_test)

          owner_test_path = Path("tcg/tests/card-pass-2-runtime-attack-modifier-owner.test.mjs")
          owner_test = owner_test_path.read_text()
          owner_test += '''\n\ntest("all structured attachment/listener modifier producers converge on Attack #14", () => {\n  const surge = fs.readFileSync("supabase/functions/_shared/tcg-match-surge-lifecycle-v0-2.ts", "utf8");\n  const listener = fs.readFileSync("supabase/functions/_shared/tcg-match-event-listener-v0-2.ts", "utf8");\n  assert.ok(surge.includes('runtimeV02InstallAttackDamageModifier'));\n  assert.equal(surge.includes('const fresh: AttackModifier[]'), false);\n  assert.equal(surge.includes('flags.runtime_v0_2_attack_modifiers = fresh'), false);\n  assert.ok(surge.includes('item.schema === "sb-tcg-attack-damage-modifier-v0.2"'));\n  assert.ok(listener.includes('candidate.source.uid,\\n      listenerId(candidate),\\n      target.top.uid,'));\n});\n'''
          owner_test_path.write_text(owner_test)
          PY

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify bounded owner repair
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-env \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-modifier-engine.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-event-listener-attachment-attack-modifier.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-surge-lifecycle-bridge.test.ts
          node --test tcg/tests/card-pass-2-runtime-attack-modifier-owner.test.mjs
          deno check supabase/functions/_shared/tcg-match-surge-lifecycle-v0-2.ts
          deno check supabase/functions/_shared/tcg-match-event-listener-v0-2.ts
          deno check supabase/functions/tcg-match-actions/index.ts

      - name: Commit tested repair and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE=da87b4c6e212317e38492f23c707c5862df13ffa
          rm .github/workflows/tcg-rc-02b2a-repair.yml
          git config user.name "Trevor"
          git config user.email "269324007+trevieisking@users.noreply.github.com"
          git add -A
          mapfile -t FILES < <(git diff --cached --name-only)
          printf '%s\n' "${FILES[@]}"
          test "${#FILES[@]}" -eq 5
          EXPECTED=$(printf '%s\n' \
            supabase/functions/_shared/tcg-match-event-listener-v0-2.ts \
            supabase/functions/_shared/tcg-match-surge-lifecycle-v0-2.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-event-listener-attachment-attack-modifier.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-surge-lifecycle-bridge.test.ts \
            tcg/tests/card-pass-2-runtime-attack-modifier-owner.test.mjs | sort)
          ACTUAL=$(printf '%s\n' "${FILES[@]}" | sort)
          test "$ACTUAL" = "$EXPECTED"
          git commit -m "fix(tcg): converge attack modifier producers"
          git push origin HEAD:repair/tcg-rc-02b2a-da87b4c
