name: TCG Reward Arc Runtime Temporary

on:
  push:
    branches:
      - feature/tcg-private-alpha-v0-5-source-recovery
    paths:
      - .github/workflows/tcg-reward-arc-runtime-temp.yml

permissions:
  contents: write

jobs:
  reward-arc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/tcg-private-alpha-v0-5-source-recovery
          fetch-depth: 0
      - name: Guard exact staging chain
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "feature/tcg-private-alpha-v0-5-source-recovery"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "664a4b2fc2142d838f605041f8f8b8ec2b42b0ce"
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply bounded Reward Arc runtime slice
        shell: bash
        run: python .github/tcg_reward_arc_patch_temp.py
      - name: Run targeted Reward Arc proof
        shell: bash
        run: |
          deno test \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-hidden-information-authority-evaluation.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-reward-inspection-ledger.test.ts
          deno check \
            supabase/functions/_shared/tcg-match-reward-inspection-v0-2.ts \
            supabase/functions/_shared/tcg-match-attack-authority-v0-2.ts \
            supabase/functions/tcg-match-actions/index.ts
          node --test \
            tcg/tests/card-pass-2-runtime-conditional-add-direct-wiring.test.mjs \
            tcg/tests/card-pass-2-runtime-reward-inspection-wiring.test.mjs
      - name: Freeze exact permanent file set and commit
        shell: bash
        run: |
          rm .github/workflows/tcg-reward-arc-runtime-temp.yml
          rm .github/tcg_reward_arc_patch_temp.py
          git add -A
          cat > /tmp/expected-files.txt <<'EOF'
          .github/tcg_reward_arc_patch_temp.py
          .github/workflows/tcg-reward-arc-runtime-temp.yml
          supabase/functions/_shared/tcg-match-attack-authority-v0-2.ts
          supabase/functions/_shared/tcg-match-reward-inspection-v0-2.ts
          supabase/functions/tcg-match-actions/index.ts
          supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-hidden-information-authority-evaluation.test.ts
          supabase/functions/tcg-tactic-actions/runtime-v0-2-reward-inspection-ledger.test.ts
          tcg/tests/card-pass-2-runtime-conditional-add-direct-wiring.test.mjs
          tcg/tests/card-pass-2-runtime-reward-inspection-wiring.test.mjs
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --cached --check
          git config user.name "stream-bandit-tcg-runtime"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "TCG: complete Reward Arc inspection authority"
          git push origin HEAD:feature/tcg-private-alpha-v0-5-source-recovery
