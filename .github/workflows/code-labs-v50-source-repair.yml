name: Code Labs V50 Source Repair

on:
  push:
    branches:
      - fix/code-labs-master-recovery-atomic-engine-20260728
    paths:
      - code-labs/tests/apply-v50-source-repair.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-labs-v50-source-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply assertion-guarded V50 source repair
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/code-labs-master-recovery-atomic-engine-20260728
          fetch-depth: 0

      - name: Apply exact source repair
        run: node code-labs/tests/apply-v50-source-repair.mjs

      - name: Commit repaired sources
        run: |
          if git diff --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/code-labs-mcp-stub/guarded-workspace.ts \
            supabase/functions/code-labs-mcp-stub/main.ts \
            supabase/functions/code-labs-mcp-stub/github-writer.ts
          git commit -m "Complete V50 atomic source contracts"
          git push origin HEAD:fix/code-labs-master-recovery-atomic-engine-20260728
