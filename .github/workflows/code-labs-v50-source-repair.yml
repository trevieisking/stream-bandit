name: Code Labs V50 Source Repair

on:
  push:
    branches:
      - fix/code-labs-master-recovery-atomic-engine-20260728
    paths:
      - code-labs/tests/apply-v50-source-repair.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/code-labs-master-recovery-atomic-engine-20260728
          fetch-depth: 0
      - run: node code-labs/tests/apply-v50-source-repair.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/code-labs-mcp-stub/github-writer.ts
          git commit -m "Expose explicit Writer reconciliation branches"
          git push origin HEAD:fix/code-labs-master-recovery-atomic-engine-20260728
