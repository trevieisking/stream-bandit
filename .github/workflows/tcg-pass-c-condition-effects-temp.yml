name: TCG Pass C Condition Effects Temporary

on:
  push:
    branches:
      - feature/tcg-private-alpha-v0-5-source-recovery
    paths:
      - .github/workflows/tcg-pass-c-condition-effects-temp.yml

permissions:
  contents: write

jobs:
  pass-c-condition-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/tcg-private-alpha-v0-5-source-recovery
          fetch-depth: 0

      - name: Guard exact staging chain
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "560c127eabacdce70ab38001ba6e88689ee23cbc"
          test "$(git rev-parse HEAD^^)" = "564fdf24480a55fd70fd8cd19a71e7c58d7ec7f0"
          actual="$(git diff --name-only HEAD^^..HEAD | sort)"
          expected="$(printf '%s\n' '.github/scripts/tcg-pass-c-condition-effects.py' '.github/workflows/tcg-pass-c-condition-effects-temp.yml' | sort)"
          test "$actual" = "$expected"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded Pass C condition-effects slice
        shell: bash
        run: python .github/scripts/tcg-pass-c-condition-effects.py

      - name: Run targeted Pass C proof
        shell: bash
        run: |
          deno test supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-condition-effects.test.ts
          deno check supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts
          node --test tcg/tests/card-pass-2-runtime-attack-condition-wiring.test.mjs
          node --test tcg/tests/card-pass-2-runtime-conditional-add-direct-wiring.test.mjs

      - name: Freeze exact permanent file set and commit
        shell: bash
        run: |
          git rm .github/scripts/tcg-pass-c-condition-effects.py .github/workflows/tcg-pass-c-condition-effects-temp.yml
          actual="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' '.github/scripts/tcg-pass-c-condition-effects.py' '.github/workflows/tcg-pass-c-condition-effects-temp.yml' 'supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts' 'supabase/functions/tcg-match-actions/index.ts' 'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-condition-effects.test.ts' 'tcg/tests/card-pass-2-runtime-attack-condition-wiring.test.mjs' | sort)"
          test "$actual" = "$expected"
          git add -A
          git config user.name "Trevor"
          git config user.email "269324007+trevieisking@users.noreply.github.com"
          git commit -m "TCG: structure attack after-damage conditions"
          git push origin HEAD:feature/tcg-private-alpha-v0-5-source-recovery
