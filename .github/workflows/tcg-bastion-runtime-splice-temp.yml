name: TCG Bastion Runtime Splice Temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tcg-bastion-runtime-splice-temp.yml

permissions:
  contents: write

jobs:
  splice:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/tcg-private-alpha-v0-5-source-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded Bastion runtime splice
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          function file(path) { return fs.readFileSync(path, 'utf8'); }
          function save(path, text) { fs.writeFileSync(path, text); }
          function replaceOne(text, oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(`missing:${label}`);
            if (text.indexOf(oldText, first + 1) >= 0) throw new Error(`duplicate:${label}`);
            return text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          const formulaPath = 'supabase/functions/_shared/tcg-match-attack-formula-v0-2.ts';
          let formula = file(formulaPath);
          formula = replaceOne(formula,
            '    event: "damage_prevented";\n    window: "current_turn";\n    min_count: 1;\n    filters: {\n      target: "source_creature";',
            '    event: "damage_prevented";\n    window: "current_turn" | "previous_opponent_turn";\n    min_count: 1;\n    filters: {\n      target: "source_creature";',
            'formula-damage-window-type');
          formula = replaceOne(formula,
            '  if (event === "damage_prevented") {\n    rejectUnsupportedFields(value, ["predicate", "event", "window", "min_count", "filters"], `${prefix}_field_unsupported`);\n    if (String(value.window || "") !== "current_turn") throw new Error(`${prefix}_window_invalid`);\n    if (value.min_count !== 1) throw new Error(`${prefix}_min_count_invalid`);',
            '  if (event === "damage_prevented") {\n    rejectUnsupportedFields(value, ["predicate", "event", "window", "min_count", "filters"], `${prefix}_field_unsupported`);\n    const window = String(value.window || "");\n    if (window !== "current_turn" && window !== "previous_opponent_turn") throw new Error(`${prefix}_window_invalid`);\n    if (value.min_count !== 1) throw new Error(`${prefix}_min_count_invalid`);',
            'formula-damage-window-parser');
          formula = replaceOne(formula,
            '      event: "damage_prevented",\n      window: "current_turn",\n      min_count: 1,',
            '      event: "damage_prevented",\n      window: window as "current_turn" | "previous_opponent_turn",\n      min_count: 1,',
            'formula-damage-window-return');
          save(formulaPath, formula);

          const evaluatorPath = 'supabase/functions/_shared/tcg-match-attack-conditional-add-evaluator-v0-2.ts';
          let evaluator = file(evaluatorPath);
          evaluator = replaceOne(evaluator,
            '  current_turn_events: RuntimeV02ConditionalAddEventSignal[];\n  source_attached_essence_kinds:',
            '  current_turn_events: RuntimeV02ConditionalAddEventSignal[];\n  previous_opponent_turn_events?: RuntimeV02ConditionalAddEventSignal[];\n  source_attached_essence_kinds:',
            'evaluator-context-type');
          evaluator = replaceOne(evaluator,
            '  if (!Array.isArray(context.current_turn_events)) {\n    throw new Error(`tcg_v0_2_attack_conditional_add_context_events_invalid:${attackId}`);\n  }\n\n  return {',
            '  if (!Array.isArray(context.current_turn_events)) {\n    throw new Error(`tcg_v0_2_attack_conditional_add_context_events_invalid:${attackId}`);\n  }\n  const previousOpponentTurnEvents = context.previous_opponent_turn_events ?? [];\n  if (!Array.isArray(previousOpponentTurnEvents)) {\n    throw new Error(`tcg_v0_2_attack_conditional_add_context_previous_opponent_events_invalid:${attackId}`);\n  }\n\n  return {',
            'evaluator-normalize-validation');
          evaluator = replaceOne(evaluator,
            '    current_turn_events: context.current_turn_events.map((event, index) => normalizeEventSignal(event, attackId, index)),\n    source_attached_essence_kinds:',
            '    current_turn_events: context.current_turn_events.map((event, index) => normalizeEventSignal(event, attackId, index)),\n    previous_opponent_turn_events: previousOpponentTurnEvents.map((event, index) => normalizeEventSignal(event, attackId, index)),\n    source_attached_essence_kinds:',
            'evaluator-normalize-return');
          evaluator = replaceOne(evaluator,
            '): boolean {\n  return context.current_turn_events.some((event) => {',
            '): boolean {\n  const events = predicate.window === "previous_opponent_turn"\n    ? context.previous_opponent_turn_events || []\n    : context.current_turn_events;\n  return events.some((event) => {',
            'evaluator-event-pool');
          save(evaluatorPath, evaluator);

          const authorityPath = 'supabase/functions/_shared/tcg-match-attack-authority-v0-2.ts';
          let authority = file(authorityPath);
          authority = replaceOne(authority,
            'import { runtimeV02CurrentTurnDamagePreventionEvents } from "./tcg-match-attack-damage-v0-2.ts";',
            'import {\n  runtimeV02CurrentTurnDamagePreventionEvents,\n  runtimeV02PreviousOpponentTurnDamagePreventionEvents,\n} from "./tcg-match-attack-damage-v0-2.ts";',
            'authority-prevention-import');
          authority = replaceOne(authority,
            '  declaration_current_turn_events?: RuntimeV02ConditionalAddEventSignal[];\n  target_permissions:',
            '  declaration_current_turn_events?: RuntimeV02ConditionalAddEventSignal[];\n  declaration_previous_opponent_turn_events?: RuntimeV02ConditionalAddEventSignal[];\n  target_permissions:',
            'authority-event-type');
          authority = replaceOne(authority,
            'function formulaUsesDamagePrevention(value: RuntimeV02ConditionalAddFormulaMetadata | null): boolean {\n  if (!value) return false;\n  return value.terms.some((term) => {\n    const predicates = "any" in term.when ? term.when.any : [term.when];\n    return predicates.some((predicate) =>\n      predicate.predicate === "event_occurred" && predicate.event === "damage_prevented"\n    );\n  });\n}',
            'function formulaUsesDamagePrevention(\n  value: RuntimeV02ConditionalAddFormulaMetadata | null,\n  window: "current_turn" | "previous_opponent_turn",\n): boolean {\n  if (!value) return false;\n  return value.terms.some((term) => {\n    const predicates = "any" in term.when ? term.when.any : [term.when];\n    return predicates.some((predicate) =>\n      predicate.predicate === "event_occurred" &&\n      predicate.event === "damage_prevented" &&\n      predicate.window === window\n    );\n  });\n}',
            'authority-prevention-formula-helper');
          authority = replaceOne(authority,
            '  if (formulaUsesDamagePrevention(formula)) {\n    events.push(...runtimeV02CurrentTurnDamagePreventionEvents(state, instanceOrId));\n  }',
            '  if (formulaUsesDamagePrevention(formula, "current_turn")) {\n    events.push(...runtimeV02CurrentTurnDamagePreventionEvents(state, instanceOrId));\n  }',
            'authority-current-prevention');
          authority = replaceOne(authority,
            '\nfunction cloneCountAddFormula(',
            '\nfunction declarationPreviousOpponentTurnEvents(\n  state: Record<string, unknown>,\n  instanceOrId: string | { card_id?: unknown; uid?: unknown } | null | undefined,\n  formula: RuntimeV02ConditionalAddFormulaMetadata | null,\n): RuntimeV02ConditionalAddEventSignal[] {\n  if (!formulaUsesDamagePrevention(formula, "previous_opponent_turn")) return [];\n  return runtimeV02PreviousOpponentTurnDamagePreventionEvents(state, instanceOrId);\n}\n\nfunction cloneCountAddFormula(',
            'authority-previous-event-builder');
          authority = replaceOne(authority,
            '      declaration_current_turn_events: [],\n      target_permissions:',
            '      declaration_current_turn_events: [],\n      declaration_previous_opponent_turn_events: [],\n      target_permissions:',
            'authority-legacy-empty');
          authority = replaceOne(authority,
            '    declaration_current_turn_events: declarationCurrentTurnEvents(state, instanceOrId, conditionalAddFormula),\n    target_permissions:',
            '    declaration_current_turn_events: declarationCurrentTurnEvents(state, instanceOrId, conditionalAddFormula),\n    declaration_previous_opponent_turn_events: declarationPreviousOpponentTurnEvents(state, instanceOrId, conditionalAddFormula),\n    target_permissions:',
            'authority-structured-snapshot');
          authority = replaceOne(authority,
            '    predicate.event === "damage_prevented" &&\n    predicate.window === "current_turn" &&',
            '    predicate.event === "damage_prevented" &&\n    (predicate.window === "current_turn" || predicate.window === "previous_opponent_turn") &&',
            'authority-ready-window');
          authority = replaceOne(authority,
            '  const currentTurnEvents = [\n    ...context.current_turn_events,\n    ...(attack.declaration_current_turn_events || []),\n  ];\n  return evaluateStructuredRuntimeConditionalAddFormula(',
            '  const currentTurnEvents = [\n    ...context.current_turn_events,\n    ...(attack.declaration_current_turn_events || []),\n  ];\n  const previousOpponentTurnEvents = [\n    ...(context.previous_opponent_turn_events || []),\n    ...(attack.declaration_previous_opponent_turn_events || []),\n  ];\n  return evaluateStructuredRuntimeConditionalAddFormula(',
            'authority-merge-previous');
          authority = replaceOne(authority,
            '      current_turn_events: currentTurnEvents,\n      source_attached_essence_kinds:',
            '      current_turn_events: currentTurnEvents,\n      previous_opponent_turn_events: previousOpponentTurnEvents,\n      source_attached_essence_kinds:',
            'authority-pass-previous');
          save(authorityPath, authority);

          const matchPath = 'supabase/functions/tcg-match-actions/index.ts';
          let match = file(matchPath);
          match = replaceOne(match,
            'if(ef.includes("prevented damage this turn")&&Number(flags.prevented_damage_turn??-1)===Number(s.turn_seq||0))bonus+=20',
            'if(conditionalAddEvaluation==null&&ef.includes("prevented damage this turn")&&Number(flags.prevented_damage_turn??-1)===Number(s.turn_seq||0))bonus+=20',
            'match-prevention-fallback-gate');
          save(matchPath, match);

          const wiringPath = 'tcg/tests/card-pass-2-runtime-conditional-add-direct-wiring.test.mjs';
          let wiring = file(wiringPath);
          wiring = replaceOne(wiring,
            '    \'if(ef.includes("looked at a reward card this match")\',\n    \'if(ef.includes("prevented damage this turn")\',\n    \'if(ef.includes("essence is discarded from this creature during this turn")\',',
            '    \'if(ef.includes("looked at a reward card this match")\',\n    \'if(ef.includes("essence is discarded from this creature during this turn")\',',
            'wiring-preserved-prevention-remove');
          wiring = replaceOne(wiring,
            '  assert.ok(\n    source.includes(\'if(conditionalAddEvaluation==null&&ef.includes("looked at your deck this turn")\'),\n    \'Predicted Hit deck-view fallback must now be gated by structured conditional authority\',\n  );',
            '  assert.ok(\n    source.includes(\'if(conditionalAddEvaluation==null&&ef.includes("looked at your deck this turn")\'),\n    \'Predicted Hit deck-view fallback must now be gated by structured conditional authority\',\n  );\n  assert.ok(\n    source.includes(\'if(conditionalAddEvaluation==null&&ef.includes("prevented damage this turn")\'),\n    \'Bastion Quake prevention fallback must now be gated by structured conditional authority\',\n  );',
            'wiring-prevention-gated-assert');
          save(wiringPath, wiring);

          const inventoryPath = 'tcg/tests/card-pass-2-runtime-conditional-add-inventory.test.mjs';
          let inventory = file(inventoryPath);
          inventory = replaceOne(inventory,
            '      window: \'current_turn\', min_count: 1,\n      filters: { target: \'source_creature\', prevention_kind_any: [\'ability\', \'relic\', \'shield\'] },',
            '      window: \'previous_opponent_turn\', min_count: 1,\n      filters: { target: \'source_creature\', prevention_kind_any: [\'ability\', \'relic\', \'shield\'] },',
            'inventory-bastion-window');
          save(inventoryPath, inventory);

          const metadataPath = 'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-metadata.test.ts';
          let metadata = file(metadataPath);
          const currentPreventionCase = '    {\n      predicate: "event_occurred",\n      event: "damage_prevented",\n      window: "current_turn",\n      min_count: 1,\n      filters: { target: "source_creature", prevention_kind_any: ["ability", "relic", "shield"] },\n    },';
          metadata = replaceOne(metadata, currentPreventionCase,
            currentPreventionCase + '\n    {\n      predicate: "event_occurred",\n      event: "damage_prevented",\n      window: "previous_opponent_turn",\n      min_count: 1,\n      filters: { target: "source_creature", prevention_kind_any: ["ability", "relic", "shield"] },\n    },',
            'metadata-previous-prevention-case');
          save(metadataPath, metadata);

          const evaluationPath = 'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-evaluation.test.ts';
          let evaluation = file(evaluationPath);
          evaluation = replaceOne(evaluation,
            '    current_turn_events: [],\n    source_attached_essence_kinds:',
            '    current_turn_events: [],\n    previous_opponent_turn_events: [],\n    source_attached_essence_kinds:',
            'evaluation-default-previous-pool');
          const bastionCurrentCase = '    {\n      id: "bastion-quake",\n      when: {\n        predicate: "event_occurred",\n        event: "damage_prevented",\n        window: "current_turn",\n        min_count: 1,\n        filters: { target: "source_creature", prevention_kind_any: ["ability", "relic", "shield"] },\n      },\n      events: [{ event: "damage_prevented", target: "source_creature", prevention_kind: "shield" }],\n    },\n';
          evaluation = replaceOne(evaluation, bastionCurrentCase, '', 'evaluation-remove-current-bastion-case');
          const evaluationAnchor = 'Deno.test("conditional_add event predicates reject nonmatching event details", () => {';
          const previousTest = `Deno.test("conditional_add keeps previous-opponent prevention isolated from current-turn events", () => {\n  const prevention: RuntimeV02ConditionalAddWhen = {\n    predicate: "event_occurred",\n    event: "damage_prevented",\n    window: "previous_opponent_turn",\n    min_count: 1,\n    filters: { target: "source_creature", prevention_kind_any: ["ability", "relic", "shield"] },\n  };\n  const signal = { event: "damage_prevented" as const, target: "source_creature" as const, prevention_kind: "shield" as const };\n  assertEquals(evaluateStructuredRuntimeConditionalAddFormula(80, formula(prevention), context({ previous_opponent_turn_events: [signal] }), "previous-opponent").damage, 100);\n  assertEquals(evaluateStructuredRuntimeConditionalAddFormula(80, formula(prevention), context({ current_turn_events: [signal] }), "current-only").damage, 80);\n});\n\n`;
          if (evaluation.indexOf(evaluationAnchor) < 0) throw new Error('missing:evaluation-anchor');
          evaluation = evaluation.replace(evaluationAnchor, previousTest + evaluationAnchor);
          save(evaluationPath, evaluation);

          const authorityTestPath = 'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-authority.test.ts';
          let authorityTest = file(authorityTestPath);
          authorityTest = replaceOne(authorityTest,
            '          event: "damage_prevented",\n          window: "current_turn",\n          min_count: 1,',
            '          event: "damage_prevented",\n          window: "previous_opponent_turn",\n          min_count: 1,',
            'authority-test-bastion-window');
          save(authorityTestPath, authorityTest);

          const deviceTestPath = 'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-device-authority-evaluation.test.ts';
          let deviceTest = file(deviceTestPath);
          deviceTest = replaceOne(deviceTest,
            '    current_turn_events: events,\n    source_attached_essence_kinds:',
            '    current_turn_events: events,\n    previous_opponent_turn_events: [],\n    source_attached_essence_kinds:',
            'device-context-previous-pool');
          deviceTest = replaceOne(deviceTest,
            'Deno.test("Bastion Quake prevention predicate is Runtime-C ready from canonical current-turn prevention events", () => {',
            'Deno.test("Bastion Quake previous-opponent prevention predicate is Runtime-C ready", () => {',
            'device-bastion-title');
          deviceTest = replaceOne(deviceTest,
            '          event: "damage_prevented",\n          window: "current_turn",\n          min_count: 1,',
            '          event: "damage_prevented",\n          window: "previous_opponent_turn",\n          min_count: 1,',
            'device-bastion-window');
          deviceTest = replaceOne(deviceTest,
            '    context([{ event: "damage_prevented", target: "source_creature", prevention_kind: "shield" }]),',
            '    context([], { previous_opponent_turn_events: [{ event: "damage_prevented", target: "source_creature", prevention_kind: "shield" }] }),',
            'device-bastion-event-pool');
          save(deviceTestPath, deviceTest);

          const bastionPath = 'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-damage-prevention-authority.test.ts';
          let bastion = file(bastionPath);
          bastion = replaceOne(bastion,
            '          event: "damage_prevented",\n          window: "current_turn",\n          min_count: 1,',
            '          event: "damage_prevented",\n          window: "previous_opponent_turn",\n          min_count: 1,',
            'bastion-formula-window');
          bastion = replaceOne(bastion,
            '    current_turn_events: [],\n    source_attached_essence_kinds:',
            '    current_turn_events: [],\n    previous_opponent_turn_events: [],\n    source_attached_essence_kinds:',
            'bastion-evaluation-context');
          const oldTail = `Deno.test("Bastion Quake reads canonical prevention from its own creature and reaches 170", () => {\n  const s = state({ relic: true, shield: 0 });\n  const target = sourceCreature(s);\n  structuredRuntimeIncomingAttackDamage(s, { essence: [] }, target, 100, attackContext);\n\n  const authority = resolveRuntimeAttackAuthority(s, source, 1, legacy());\n  if (!authority) throw new Error("Bastion Quake authority required");\n  const evaluation = evaluateRuntimeAttackReadyConditionalAddFormula(authority, evaluationContext());\n  assertEquals(evaluation?.damage, 170);\n  assertEquals(evaluation?.terms[0].matched, true);\n  assertEquals(evaluation?.terms[0].contribution, 20);\n});\n\nDeno.test("Bastion Quake remains structured and contributes zero without current-turn prevention", () => {\n  const s = state({ relic: true, shield: 0 });\n  const authority = resolveRuntimeAttackAuthority(s, source, 1, legacy());\n  if (!authority) throw new Error("Bastion Quake authority required");\n  const evaluation = evaluateRuntimeAttackReadyConditionalAddFormula(authority, evaluationContext());\n  assertEquals(evaluation?.damage, 150);\n  assertEquals(evaluation?.terms[0].matched, false);\n  assertEquals(evaluation?.terms[0].contribution, 0);\n});`;
          const newTail = `Deno.test("Bastion Quake reads prevention from the previous opponent turn and reaches 170", () => {\n  const s = state({ relic: true, shield: 0 });\n  const target = sourceCreature(s);\n  structuredRuntimeIncomingAttackDamage(s, { essence: [] }, target, 100, attackContext);\n  s.active_seat = 1;\n  s.turn_seq = 8;\n  (s.personal_turns as any)["1"] = 4;\n  assertEquals(runtimeV02PreviousOpponentTurnDamagePreventionEvents(s, source).length, 1);\n  const authority = resolveRuntimeAttackAuthority(s, source, 1, legacy());\n  if (!authority) throw new Error("Bastion Quake authority required");\n  const evaluation = evaluateRuntimeAttackReadyConditionalAddFormula(authority, evaluationContext());\n  assertEquals(evaluation?.damage, 170);\n  assertEquals(evaluation?.terms[0].matched, true);\n  assertEquals(evaluation?.terms[0].contribution, 20);\n});\n\nDeno.test("Bastion Quake previous-opponent prevention survives a controller extra turn", () => {\n  const s = state({ relic: false, shield: 20 });\n  const target = sourceCreature(s);\n  structuredRuntimeIncomingAttackDamage(s, { essence: [] }, target, 100, attackContext);\n  s.active_seat = 1;\n  s.turn_seq = 9;\n  (s.personal_turns as any)["1"] = 5;\n  const authority = resolveRuntimeAttackAuthority(s, source, 1, legacy());\n  if (!authority) throw new Error("Bastion Quake authority required");\n  assertEquals(evaluateRuntimeAttackReadyConditionalAddFormula(authority, evaluationContext())?.damage, 170);\n});\n\nDeno.test("Bastion Quake prevention expires when the opponent begins a newer personal turn", () => {\n  const s = state({ relic: false, shield: 20 });\n  const target = sourceCreature(s);\n  structuredRuntimeIncomingAttackDamage(s, { essence: [] }, target, 100, attackContext);\n  (s.personal_turns as any)["2"] = 5;\n  s.active_seat = 1;\n  s.turn_seq = 10;\n  (s.personal_turns as any)["1"] = 4;\n  assertJsonEquals(runtimeV02PreviousOpponentTurnDamagePreventionEvents(s, source), []);\n  const authority = resolveRuntimeAttackAuthority(s, source, 1, legacy());\n  if (!authority) throw new Error("Bastion Quake authority required");\n  assertEquals(evaluateRuntimeAttackReadyConditionalAddFormula(authority, evaluationContext())?.damage, 150);\n});\n\nDeno.test("Bastion Quake does not treat self-sourced prevention as previous-opponent prevention", () => {\n  const s = state({ relic: false, shield: 20 });\n  s.active_seat = 1;\n  const target = sourceCreature(s);\n  const selfContext: RuntimeAttackDamageContext = { ...attackContext, target_controller: "self", source_controller: "self" };\n  structuredRuntimeIncomingAttackDamage(s, { essence: [] }, target, 100, selfContext);\n  assertJsonEquals(runtimeV02PreviousOpponentTurnDamagePreventionEvents(s, source), []);\n  const authority = resolveRuntimeAttackAuthority(s, source, 1, legacy());\n  if (!authority) throw new Error("Bastion Quake authority required");\n  assertEquals(evaluateRuntimeAttackReadyConditionalAddFormula(authority, evaluationContext())?.damage, 150);\n});`;
          bastion = replaceOne(bastion, oldTail, newTail, 'bastion-tail-rewrite');
          save(bastionPath, bastion);

          const surgePath = 'supabase/functions/tcg-tactic-actions/runtime-v0-2-surge-lifecycle-bridge.test.ts';
          let surge = file(surgePath);
          surge = replaceOne(surge,
            'registry_sha256: "b1bc874a6d3707f5c93cd4067994a12111416da636cb15048d10e109829b1c00"',
            'registry_sha256: "8e2556604fd1757917ea60b7e9af8c0de717a69b72c7e37b0e2690abdcce430f"',
            'surge-registry-digest');
          save(surgePath, surge);
          NODE
          git diff --check

      - name: Run targeted Bastion and frozen-registry tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tcg/tests/card-pass-2-runtime-conditional-add-inventory.test.mjs \
            tcg/tests/card-pass-2-runtime-conditional-add-direct-wiring.test.mjs
          deno test \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-metadata.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-evaluation.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-authority.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-device-authority-evaluation.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-damage-prevention-authority.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-surge-lifecycle-bridge.test.ts

      - name: Commit bounded runtime splice and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add \
            supabase/functions/_shared/tcg-match-attack-formula-v0-2.ts \
            supabase/functions/_shared/tcg-match-attack-conditional-add-evaluator-v0-2.ts \
            supabase/functions/_shared/tcg-match-attack-authority-v0-2.ts \
            supabase/functions/tcg-match-actions/index.ts \
            tcg/tests/card-pass-2-runtime-conditional-add-direct-wiring.test.mjs \
            tcg/tests/card-pass-2-runtime-conditional-add-inventory.test.mjs \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-metadata.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-evaluation.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-authority.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-conditional-add-device-authority-evaluation.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-damage-prevention-authority.test.ts \
            supabase/functions/tcg-tactic-actions/runtime-v0-2-surge-lifecycle-bridge.test.ts
          git rm .github/workflows/tcg-bastion-runtime-splice-temp.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "TCG: wire Bastion previous-opponent prevention"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
