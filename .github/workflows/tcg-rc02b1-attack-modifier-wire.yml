name: TCG RC-02b1 Attack Modifier Candidate

on:
  push:
    branches:
      - repair/tcg-rc02b1-attack-modifier-wire-25d7641

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard bootstrap
        shell: bash
        run: |
          set -euo pipefail
          expected_base='25d7641aca351d64571d407d055a3588f1af041f'
          mapfile -t changed < <(git diff --name-only "$expected_base" HEAD | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = '.github/rc02b1_patch.py'
          test "${changed[1]}" = '.github/workflows/tcg-rc02b1-attack-modifier-wire.yml'
          test "${changed[2]}" = 'tcg/tests/card-pass-2-runtime-attack-modifier-live-wiring.test.mjs'

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc02b1_patch.py
          rm .github/rc02b1_patch.py
          rm .github/workflows/tcg-rc02b1-attack-modifier-wire.yml

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tcg/tests/card-pass-2-runtime-attack-modifier-owner.test.mjs \
            tcg/tests/card-pass-2-runtime-attack-modifier-live-wiring.test.mjs
          deno test supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-modifier-engine.test.ts
          deno check supabase/functions/tcg-match-actions/index.ts
          git diff --check
          expected_base='25d7641aca351d64571d407d055a3588f1af041f'
          mapfile -t changed < <(git diff --name-only "$expected_base" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'supabase/functions/tcg-match-actions/index.ts'
          test "${changed[1]}" = 'tcg/tests/card-pass-2-runtime-attack-modifier-live-wiring.test.mjs'

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(tcg): wire canonical attack modifier owner'
          git push origin HEAD:repair/tcg-rc02b1-attack-modifier-wire-25d7641
