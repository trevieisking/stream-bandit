name: TCG Card Pass 2 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tcg-card-pass-2-validation.yml
      - tcg-card-pass-2-*.md
      - tcg-card-pass-2-*.json
      - tcg-runtime-*.json
      - tcg-set-one-registry-builder-v0.2.mjs
      - tcg-set-one-shadow-registry-builder-v0.2.mjs
      - tcg-set-one-starters-v0.2.json
      - tcg/tests/**
      - supabase/functions/tcg-tactic-actions/**
      - supabase/migrations/20260906183000_tcg_v0_2_shadow_registry.sql
      - supabase/migrations/20260906190000_tcg_v0_2_set_one_shadow_registry_load.sql
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-card-pass-2-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  set-one-structure:
    name: Set One 193-card structure, starter and effect-grammar validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Card Pass 2 candidates, eight exact starters and effect grammar
        run: node --test tcg/tests/card-pass-2-*.test.mjs

      - name: Generate immutable Set One v0.2 shadow-registry migration payload
        run: node tcg-set-one-shadow-registry-builder-v0.2.mjs tcg-set-one-shadow-registry-v0.2.generated.sql

      - name: Upload immutable Set One v0.2 shadow-registry migration payload
        uses: actions/upload-artifact@v4
        with:
          name: tcg-set-one-shadow-registry-v0-2
          path: tcg-set-one-shadow-registry-v0.2.generated.sql
          if-no-files-found: error
          retention-days: 1

      - name: Materialize immutable migration on this PR branch only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TARGET: supabase/migrations/20260906190000_tcg_v0_2_set_one_shadow_registry_load.sql
        run: |
          cp tcg-set-one-shadow-registry-v0.2.generated.sql "$TARGET"
          if git diff --quiet -- "$TARGET" && git ls-files --error-unmatch "$TARGET" >/dev/null 2>&1; then
            echo "Immutable migration already matches generated bytes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "Materialize immutable TCG v0.2 shadow registry payload"
          git push origin "HEAD:${HEAD_REF}"

  runtime-core:
    name: v0.2 deterministic runtime core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run v0.2 runtime core tests
        run: deno test supabase/functions/tcg-tactic-actions/runtime-v0-2-core.test.ts
