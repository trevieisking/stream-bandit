name: TCG Pass C Attack Self-Heal Temporary

on:
  push:
    branches:
      - feature/tcg-private-alpha-v0-5-source-recovery
    paths:
      - .github/workflows/tcg-pass-c-attack-self-heal-temp.yml

permissions:
  contents: write

jobs:
  pass-c-attack-self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/tcg-private-alpha-v0-5-source-recovery
          fetch-depth: 0

      - name: Guard exact staging chain
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "ec806258fe86a2ed7aebb6ed272cd0b765c6389b"
          test "$(git rev-parse HEAD^^)" = "1fc55f87f66d8d1eda2902d298e0e039857962b0"
          actual="$(git diff --name-only HEAD^^..HEAD | sort)"
          expected="$(printf '%s\n' '.github/scripts/tcg-pass-c-attack-self-heal.py' '.github/workflows/tcg-pass-c-attack-self-heal-temp.yml' | sort)"
          test "$actual" = "$expected"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded Pass C self-heal slice
        shell: bash
        run: python .github/scripts/tcg-pass-c-attack-self-heal.py

      - name: Run full TCG proof before commit
        shell: bash
        run: |
          git diff --check
          deno test supabase/functions/tcg-tactic-actions/runtime-v0-2-*.test.ts
          deno check supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts
          deno check supabase/functions/tcg-tactic-actions/index.ts
          deno check supabase/functions/tcg-match-actions/index.ts
          node --test tcg/tests/card-pass-2-*.test.mjs

      - name: Freeze exact permanent file set and commit
        shell: bash
        run: |
          git rm .github/scripts/tcg-pass-c-attack-self-heal.py .github/workflows/tcg-pass-c-attack-self-heal-temp.yml
          actual="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/tcg-pass-c-attack-self-heal.py' \
            '.github/workflows/tcg-pass-c-attack-self-heal-temp.yml' \
            'supabase/functions/_shared/tcg-match-attack-effects-v0-2.ts' \
            'supabase/functions/tcg-match-actions/index.ts' \
            'supabase/functions/tcg-tactic-actions/index.ts' \
            'supabase/functions/tcg-tactic-actions/runtime-v0-2-core.ts' \
            'supabase/functions/tcg-tactic-actions/runtime-v0-2-attack-self-heal-effects.test.ts' \
            'tcg/tests/card-pass-2-runtime-attack-self-heal-wiring.test.mjs' | sort)"
          test "$actual" = "$expected"
          git diff --check
          git add -A
          git config user.name "Trevor"
          git config user.email "269324007+trevieisking@users.noreply.github.com"
          git commit -m "TCG: structure conditional attack self-healing"
          git push origin HEAD:feature/tcg-private-alpha-v0-5-source-recovery
